<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
<rect x="114" y="14" width="176" height="280" rx="6" fill="rgba(115,18,61,0.08)"/>
<rect x="112" y="10" width="176" height="280" rx="6" fill="#fff" stroke="#e2c3d1"/>
<text x="124" y="28" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="7" font-weight="900" fill="#97144d" font-style="italic" letter-spacing="0.6">PRISM</text><text x="154" y="28" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" fill="#1d1418">Brainstorm rules</text>
<circle cx="133" cy="53.14285714285714" r="8" fill="#97144d" stroke="#97144d" stroke-width="1"/><text x="133" y="56.14285714285714" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="900" fill="#fff" text-anchor="middle" letter-spacing="0.6">1</text><text x="148" y="56.14285714285714" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="700" fill="#1d1418">Defer judgement</text><circle cx="133" cy="87.42857142857142" r="8" fill="#97144d" stroke="#97144d" stroke-width="1"/><text x="133" y="90.42857142857142" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="900" fill="#fff" text-anchor="middle" letter-spacing="0.6">2</text><text x="148" y="90.42857142857142" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="700" fill="#1d1418">Encourage wild ideas</text><circle cx="133" cy="121.71428571428571" r="8" fill="#97144d" stroke="#97144d" stroke-width="1"/><text x="133" y="124.71428571428571" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="900" fill="#fff" text-anchor="middle" letter-spacing="0.6">3</text><text x="148" y="124.71428571428571" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="700" fill="#1d1418">Build on the ideas of others</text><circle cx="133" cy="156" r="8" fill="#97144d" stroke="#97144d" stroke-width="1"/><text x="133" y="159" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="900" fill="#fff" text-anchor="middle" letter-spacing="0.6">4</text><text x="148" y="159" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="700" fill="#1d1418">Stay focused on the topic</text><circle cx="133" cy="190.28571428571428" r="8" fill="#97144d" stroke="#97144d" stroke-width="1"/><text x="133" y="193.28571428571428" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="900" fill="#fff" text-anchor="middle" letter-spacing="0.6">5</text><text x="148" y="193.28571428571428" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="700" fill="#1d1418">One conversation at a time</text><circle cx="133" cy="224.57142857142856" r="8" fill="#97144d" stroke="#97144d" stroke-width="1"/><text x="133" y="227.57142857142856" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="900" fill="#fff" text-anchor="middle" letter-spacing="0.6">6</text><text x="148" y="227.57142857142856" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="700" fill="#1d1418">Be visual</text><circle cx="133" cy="258.8571428571429" r="8" fill="#97144d" stroke="#97144d" stroke-width="1"/><text x="133" y="261.8571428571429" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="900" fill="#fff" text-anchor="middle" letter-spacing="0.6">7</text><text x="148" y="261.8571428571429" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="700" fill="#1d1418">Go for quantity</text>
</svg>